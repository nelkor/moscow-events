      - description
      title: VenueOut
      description: Площадка, включая представление единственной PostGIS-точки как latitude/longitude; эти поля могут
        одновременно быть null.
      allOf:
      - if:
          required:
          - latitude
          properties:
            latitude:
              type: number
        then:
          required:
          - longitude
          properties:
            longitude:
              type: number
      - if:
          required:
          - longitude
          properties:
            longitude:
              type: number
        then:
          required:
          - latitude
          properties:
            latitude:
              type: number
    VenuePatch:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          pattern: \S
          description: Человекочитаемое название. В SAMPLE используется русский язык; пользовательский Unicode допускается.
        city:
          type: string
          const: Москва
          description: Город площадки; в этой версии разрешено только значение «Москва».
        district_code:
          type: string
          enum:
          - CAO
          - SAO
          - SVAO
          - VAO
          - UVAO
          - UAO
          - UZAO
          - ZAO
          - SZAO
          - ZELAO
          - TAO
          - NAO
          description: Технический код административного округа Москвы из /api/v1/meta/districts.
        street:
          type: string
          maxLength: 500
          minLength: 1
          pattern: \S
          description: Название улицы, переулка, проспекта или площади. Текст не используется для геопоиска.
        house:
          type: string
          maxLength: 100
          minLength: 1
          pattern: \S
          description: Номер дома, корпуса или строения в текстовом виде.
        formatted_address:
          type: string
          maxLength: 1000
          minLength: 1
          pattern: \S
          description: Полный адрес для отображения клиентом. Не вычисляется по координатам автоматически.
        latitude:
          anyOf:
          - type: number
            maximum: 90.0
            minimum: -90.0
          - type: 'null'
          description: Широта WGS84 в градусах, от -90 до 90. Обе координаты либо заданы, либо отсутствуют.
        longitude:
          anyOf:
          - type: number
            maximum: 180.0
            minimum: -180.0
          - type: 'null'
          description: Долгота WGS84 в градусах, от -180 до 180. В GeoJSON передаётся первой.
        capacity:
          type: integer
          maximum: 2147483647.0
          exclusiveMinimum: 0.0
          description: Положительная вместимость. Уменьшение ниже квоты любого связанного события запрещено (409
            CAPACITY_BELOW_QUOTA).
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: Необязательное текстовое описание; null означает отсутствие описания.
      additionalProperties: false
      type: object
      title: VenuePatch
      description: 'Частичное изменение площадки. При изменении координат обязательно передать оба ключа: либо оба
        числа, либо оба null. Вместимость не может стать ниже любой существующей квоты событий.'
      allOf:
      - if:
          required:
          - latitude
          properties:
            latitude:
              type: number
        then:
          required:
          - longitude
          properties:
            longitude:
              type: number
      - if:
          required:
          - longitude
          properties:
            longitude:
              type: number
        then:
          required:
          - latitude
          properties:
            latitude:
              type: number
      dependentRequired:
        latitude:
        - longitude
        longitude:
        - latitude
