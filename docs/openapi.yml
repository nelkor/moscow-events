                type: string
                description: HTML-документ в UTF-8.
components:
  schemas:
    AgeRating:
      type: integer
      enum:
      - 0
      - 6
      - 12
      - 16
      - 18
      description: Допустимые возрастные категории, соответствующие 0+, 6+, 12+, 16+, 18+.
    AgeRatingCatalog:
      type: object
      required:
      - data
      description: Полный справочник с техническими кодами и русскими отображаемыми названиями; без пагинации.
      properties:
        data:
          type: array
          minItems: 5
          maxItems: 5
          description: Все элементы справочника текущей версии v1.
          items:
            type: object
            required:
            - code
            - name
            properties:
              code:
                $ref: '#/components/schemas/AgeRating'
              name:
                type: string
                description: Русское отображаемое название или возрастная категория вида 12+.
    AnalyticsMeta:
      properties:
        group_by:
          type: string
          description: Фактически применённая группировка; при interval для бронирований — выбранный временной интервал.
        timezone:
          type: string
          description: Часовой пояс группировок, всегда Europe/Moscow.
          const: Europe/Moscow
        metrics:
          items:
            type: string
          type: array
          description: Фактически запрошенные метрики. В data присутствуют только они и ключ/подпись группы.
      type: object
      required:
      - group_by
      - timezone
      - metrics
      title: AnalyticsMeta
      description: Параметры фактически выполненной агрегации.
    ApiLimits:
      type: object
      additionalProperties: false
      required:
      - page_size
      - bulk_operations
      - geojson_features
      description: Жёсткие ограничения одного запроса текущего API.
      properties:
        page_size:
          type: integer
          const: 100
          description: Максимальный размер страницы.
        bulk_operations:
          type: integer
          const: 200
          description: Максимальное число операций одного bulk-пакета.
        geojson_features:
          type: integer
          const: 1000
          description: Максимальное число GeoJSON Features в ответе.
    ArtistCreate:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          pattern: \S
          description: Человекочитаемое название. В SAMPLE используется русский язык; пользовательский Unicode допускается.
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: Необязательное текстовое описание; null означает отсутствие описания.
        primary_genre_code:
          anyOf:
          - type: string
            enum:
            - concert
            - theatre
            - standup
            - lecture
            - exhibition
            - festival
            - cinema
            - workshop
            - excursion
          - type: 'null'
          description: Основной жанр артиста из /api/v1/meta/genres; может отсутствовать.
        image_url:
          anyOf:
          - type: string
            maxLength: 2083
            minLength: 1
            format: uri
          - type: 'null'
          description: Необязательная абсолютная HTTP/HTTPS-ссылка. Сервер не скачивает и не хранит изображение.
      additionalProperties: false
      type: object
      required:
      - name
      title: ArtistCreate
      description: Создание артиста или группы. Совпадающие и похожие имена разрешены. Необязательные поля по умолчанию
        null.
    ArtistOut:
      properties:
        id:
          type: string
          format: uuid
          description: UUID сущности, созданный сервером.
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Дата создания записи с часовым поясом; задаёт сервер.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Дата последнего изменения записи с часовым поясом; задаёт сервер.
          readOnly: true
        name:
          type: string
          description: Человекочитаемое название. В SAMPLE используется русский язык; пользовательский Unicode допускается.
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: Необязательное текстовое описание; null означает отсутствие описания.
        primary_genre_code:
          anyOf:
          - $ref: '#/components/schemas/GenreCode'
          - type: 'null'
          description: Основной жанр артиста из /api/v1/meta/genres; может отсутствовать.
        image_url:
          anyOf:
          - type: string
          - type: 'null'
          description: Необязательная абсолютная HTTP/HTTPS-ссылка. Сервер не скачивает и не хранит изображение.
      type: object
      required:
      - id
      - created_at
      - updated_at
      - name
      - description
      - primary_genre_code
      - image_url
      title: ArtistOut
      description: Артист/группа с серверными UUID и датами аудита.
    ArtistPatch:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          pattern: \S
          description: Человекочитаемое название. В SAMPLE используется русский язык; пользовательский Unicode допускается.
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: Необязательное текстовое описание; null означает отсутствие описания.
        primary_genre_code:
          anyOf:
          - type: string
            enum:
            - concert
            - theatre
            - standup
            - lecture
            - exhibition
            - festival
            - cinema
            - workshop
            - excursion
          - type: 'null'
          description: Основной жанр артиста из /api/v1/meta/genres; может отсутствовать.
        image_url:
          anyOf:
          - type: string
            maxLength: 2083
            minLength: 1
            format: uri
          - type: 'null'
          description: Необязательная абсолютная HTTP/HTTPS-ссылка. Сервер не скачивает и не хранит изображение.
      additionalProperties: false
      type: object
      title: ArtistPatch
      description: Частичное изменение артиста. Пропущенные поля сохраняются; description, primary_genre_code и
        image_url можно очистить через null.
    BulkArchive:
      properties:
        op:
          type: string
          const: archive
          description: 'Тип bulk-операции: create, update либо archive.'
        id:
          type: string
          format: uuid
          description: UUID сущности, созданный сервером.
      additionalProperties: false
      type: object
      required:
      - op
      - id
      title: BulkArchive
      description: Архивировать существующее событие с id, установив status=archived. fields не принимается. Архивация
        сама по себе не отменяет бронирования.
    BulkChange:
      properties:
        operation_index:
          type: integer
          description: Индекс операции в массиве operations, начиная с 0.
        op:
          type: string
          description: 'Тип bulk-операции: create, update либо archive.'
        id:
          type: string
          format: uuid
          description: UUID сущности, созданный сервером.
        event:
          $ref: '#/components/schemas/EventOut'
          description: Снимок полного мероприятия после конкретной операции предпросмотра или применения.
      type: object
      required:
      - operation_index
      - op
      - id
      - event
      title: BulkChange
      description: Результат одной успешной операции. Повторные операции над одним UUID дают отдельные записи changes
        и отдельные значения счётчиков.
    BulkCreate:
      properties:
        op:
          type: string
          const: create
          description: 'Тип bulk-операции: create, update либо archive.'
        fields:
          $ref: '#/components/schemas/EventCreate'
          description: Изменяемые поля мероприятия. Для create обязательны все обязательные поля EventCreate, для
            update — подмножество EventPatch.
      additionalProperties: false
      type: object
      required:
      - op
      - fields
      title: BulkCreate
      description: Создать событие из fields по правилам EventCreate. id генерируется сервером.
    BulkError:
      properties:
        operation_index:
          type: integer
          description: Индекс операции в массиве operations, начиная с 0.
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Английское служебное сообщение. Локализованный текст интерфейса выбирает клиент по code.
        details:
          $ref: '#/components/schemas/ErrorDetails'
      type: object
      required:
      - operation_index
      - code
      - message
      - details
      title: BulkError
      description: Бизнес-ошибка отдельной операции с индексом от 0; code и message имеют тот же смысл, что в обычном
        API.
    BulkOut:
      properties:
        dry_run:
          type: boolean
          description: true (по умолчанию) — проверка и предпросмотр без сохранения; false — атомарное применение
            корректного пакета.
        created:
          type: integer
          description: Количество успешных операций create в результате/предпросмотре, а не общий размер БД.
        updated:
          type: integer
          description: Количество успешных операций update; повторное изменение одной сущности учитывается отдельно.
        archived:
          type: integer
          description: Количество успешных операций archive; повторные операции считаются отдельно.
        changes:
          items:
            $ref: '#/components/schemas/BulkChange'
          type: array
          description: Успешные операции в исходном порядке. Поле event содержит состояние непосредственно после
            соответствующей операции.
        errors:
          items:
            $ref: '#/components/schemas/BulkError'
          type: array
          description: Список ошибок; в корректно применённом пакете пуст. В предпросмотре может содержать бизнес-ошибки.
        operation_index_base:
          type: integer
          const: 0
          description: 'Всегда 0: индексы операций в changes и errors отсчитываются с нуля.'
      type: object
      required:
      - dry_run
      - created
      - updated
      - archived
      - changes
      - errors
      - operation_index_base
      title: BulkOut
      description: При dry_run=true изменения не сохраняются; errors может быть непустым, счётчики описывают только
        успешные операции предпросмотра. При dry_run=false успешный ответ содержит errors=[]; любая бизнес-ошибка
        даёт 422 BULK_VALIDATION_FAILED и полный rollback. UUID созданий в предпросмотре не зарезервированы и при
        применении будут другими.
    BulkRequest:
      properties:
        dry_run:
          type: boolean
          default: true
          description: true (по умолчанию) — проверка и предпросмотр без сохранения; false — атомарное применение
            корректного пакета.
        operations:
          items:
            oneOf:
            - $ref: '#/components/schemas/BulkCreate'
            - $ref: '#/components/schemas/BulkUpdate'
            - $ref: '#/components/schemas/BulkArchive'
            discriminator:
              propertyName: op
              mapping:
                archive: '#/components/schemas/BulkArchive'
                create: '#/components/schemas/BulkCreate'
                update: '#/components/schemas/BulkUpdate'
          type: array
          maxItems: 200
          minItems: 1
          description: От 1 до 200 последовательных операций. Их порядок значим, успешная операция видна следующим
            в пакете.
      additionalProperties: false
      type: object
      required:
      - operations
      title: BulkRequest
      description: Последовательный пакет 1–200 операций, различаемых по полю op. По умолчанию это предпросмотр.
        Для сохранения dry_run=false требуется заголовок Idempotency-Key.
    BulkUpdate:
      properties:
        op:
          type: string
          const: update
          description: 'Тип bulk-операции: create, update либо archive.'
        id:
          type: string
          format: uuid
          description: UUID сущности, созданный сервером.
        fields:
          $ref: '#/components/schemas/EventPatch'
          description: Изменяемые поля мероприятия. Для create обязательны все обязательные поля EventCreate, для
            update — подмножество EventPatch.
      additionalProperties: false
      type: object
      required:
      - op
      - id
      - fields
      title: BulkUpdate
      description: Частично изменить существующее событие с id. fields имеет семантику EventPatch.
    ControlPoint:
      type: object
      required:
      - latitude
      - longitude
      - radius_m
      additionalProperties: false
      description: Контрольная точка SAMPLE на Театральной площади, 1, и радиус в метрах.
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: Широта центра WGS84.
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: Долгота центра WGS84.
        radius_m:
          type: number
          minimum: 1
          maximum: 100000
          description: Контрольный радиус в метрах; в HTTP-запросе nearby требуется целое число.
    DatasetCounts:
      type: object
      additionalProperties: false
      required:
      - artists
      - venues
      - series
      - events
      - reservations
      description: Точные текущие количества всех предметных сущностей, без фильтра по статусу.
      properties:
        artists:
          type: integer
          minimum: 0
          description: Количество артистов/групп.
        venues:
          type: integer
          minimum: 0
          description: Количество площадок, включая площадки без координат.
        series:
          type: integer
          minimum: 0
          description: Количество серий.
        events:
          type: integer
          minimum: 0
          description: Количество событий всех статусов.
        reservations:
          type: integer
          minimum: 0
          description: 'Количество всех бронирований: confirmed и cancelled.'
    DatasetOut:
      properties:
        schema_version:
          type: string
          description: Версия миграции схемы БД, совместимая с этим backend; сейчас 2026_01.
        dataset_id:
          type: string
          format: uuid
          description: UUID конкретного набора данных; сохраняется при рестарте и восстановлении дампа.
        dataset_kind:
          type: string
          description: 'Происхождение набора: sample, student_created или imported. Не ограничивает возможности
            API.'
          enum:
          - sample
          - student_created
          - imported
        sample_seed_version:
          anyOf:
          - type: string
          - type: 'null'
          description: Редакция SAMPLE, которой первоначально заполнена БД, либо null. Не переключатель набора при
            рестарте.
        reference_time:
          type: string
          format: date-time
          description: Фиксированное учебное время из метаданных БД. После импорта используется время импортированного
            набора.
        created_at:
          type: string
          format: date-time
          description: Дата создания записи с часовым поясом; задаёт сервер.
          readOnly: true
        source_dataset_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: UUID предыдущего набора, если указан при подготовке импортированных данных; иначе null.
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: Необязательное текстовое описание; null означает отсутствие описания.
      type: object
      required:
      - schema_version
      - dataset_id
      - dataset_kind
      - sample_seed_version
      - reference_time
      - created_at
      - source_dataset_id
      - description
      title: DatasetOut
      description: Одна запись метаинформации набора, переносимая в дампе вместе с предметными таблицами. Не редактируется
        отдельным HTTP-методом.
    DistrictCatalog:
      type: object
      required:
      - data
      description: Полный справочник с техническими кодами и русскими отображаемыми названиями; без пагинации.
      properties:
        data:
          type: array
          minItems: 12
          maxItems: 12
          description: Все элементы справочника текущей версии v1.
          items:
            type: object
            required:
            - code
            - name
            properties:
              code:
                $ref: '#/components/schemas/DistrictCode'
              name:
                type: string
                description: Русское отображаемое название или возрастная категория вида 12+.
    DistrictCode:
      type: string
      enum:
      - CAO
      - SAO
      - SVAO
      - VAO
      - UVAO
      - UAO
      - UZAO
      - ZAO
      - SZAO
      - ZELAO
      - TAO
      - NAO
      description: Коды административных округов Москвы; отображаемые названия возвращает /meta/districts.
    ErrorBody:
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Английское служебное сообщение. Локализованный текст интерфейса выбирает клиент по code.
        details:
          $ref: '#/components/schemas/ErrorDetails'
      type: object
      required:
      - code
      - message
      title: ErrorBody
      description: Машинный код, английское сообщение и машинные подробности ошибки.
    ErrorCode:
      type: string
      enum:
      - VALIDATION_ERROR
      - IDEMPOTENCY_KEY_REQUIRED
      - INVALID_GROUPING
      - NOT_FOUND
      - RESOURCE_IN_USE
      - CAPACITY_BELOW_QUOTA
      - QUOTA_BELOW_SALES
      - EVENT_NOT_BOOKABLE
      - INSUFFICIENT_TICKETS
      - IDEMPOTENCY_CONFLICT
      - INTEGRITY_CONFLICT
      - CONCURRENT_MODIFICATION
      - INVALID_NAME
      - INVALID_GENRE
      - INVALID_CITY
      - INVALID_DISTRICT
      - INVALID_CAPACITY
      - INVALID_ADDRESS
      - INVALID_COORDINATES
      - INVALID_TITLE
      - TIMEZONE_REQUIRED
      - INVALID_INTERVAL
      - INVALID_PRICE
      - INVALID_QUOTA
      - INVALID_AGE_RATING
      - INVALID_STATUS
      - QUOTA_EXCEEDS_CAPACITY
      - INVALID_QUANTITY
      - BULK_VALIDATION_FAILED
      - NOT_READY
      - SCHEMA_MISMATCH
      - DATABASE_UNAVAILABLE
      - INTERNAL_ERROR
      - HTTP_ERROR
      description: 'Стабильные машинные коды. Валидация Pydantic обычно даёт VALIDATION_ERROR, даже если то же ограничение
        защищено отдельным кодом доменного слоя. В bulk бизнес-ошибки вложены в errors: их обычный HTTP-статус не
        становится статусом всего ответа.'
      x-error-catalog:
        VALIDATION_ERROR:
          http_statuses:
          - 400
          - 422
          message: Request validation failed
          description: Валидация query/path/header либо JSON; при ошибках значений тела используется HTTP 422.
        IDEMPOTENCY_KEY_REQUIRED:
          http_statuses:
          - 400
          message: Idempotency-Key is required
          description: Отсутствует обязательный заголовок идемпотентности.
        INVALID_GROUPING:
          http_statuses:
          - 400
          message: Interval must match the time grouping
          description: interval не совпадает с явно выбранным group_by временного ряда.
        NOT_FOUND:
          http_statuses:
          - 404
          message: Resource not found
          description: Нет сущности по UUID, включая требуемый объект по внешней ссылке.
        RESOURCE_IN_USE:
          http_statuses:
          - 409
          message: Resource is referenced by other records
          description: Удаляемый артист, площадка или серия используются событиями либо у события есть любые бронирования.
        CAPACITY_BELOW_QUOTA:
          http_statuses:
          - 409
          message: Capacity is below an existing event quota
          description: Новая вместимость меньше хотя бы одной существующей квоты событий площадки.
        QUOTA_BELOW_SALES:
          http_statuses:
          - 409
          message: Ticket quota is below confirmed sales
          description: Квота ниже суммы подтверждённых забронированных билетов.
        EVENT_NOT_BOOKABLE:
          http_statuses:
          - 409
          message: Event is not published
          description: Новую бронь пытаются создать для статуса, отличного от published.
        INSUFFICIENT_TICKETS:
          http_statuses:
          - 409
          message: Not enough tickets available
          description: quantity превышает доступный остаток; details содержит event_id, requested, available.
        IDEMPOTENCY_CONFLICT:
          http_statuses:
          - 409
          message: Idempotency key was used with a different request
          description: Ключ ранее использован с другим разобранным запросом в том же методе.
        INTEGRITY_CONFLICT:
          http_statuses:
          - 409
          message: Operation conflicts with stored data
          description: Конфликт с ограничением целостности PostgreSQL.
        CONCURRENT_MODIFICATION:
          http_statuses:
          - 409
          message: Concurrent modification; retry the request
          description: Конкурирующее изменение, взаимная блокировка или невозможность получить блокировку. Запрос
            можно повторить.
        INVALID_NAME:
          http_statuses:
          - 422
          message: Name must contain between 1 and 200 characters
          description: Недопустимое имя артиста, площадки или серии.
        INVALID_GENRE:
          http_statuses:
          - 422
          message: Unknown genre code
          description: Код жанра отсутствует в справочнике.
        INVALID_CITY:
          http_statuses:
          - 422
          message: City must be Moscow
          description: Для площадки указан другой город.
        INVALID_DISTRICT:
          http_statuses:
          - 422
          message: Unknown district code
          description: Неизвестный код административного округа.
        INVALID_CAPACITY:
          http_statuses:
          - 422
          message: Capacity must be positive
          description: Вместимость должна быть положительной.
        INVALID_ADDRESS:
          http_statuses:
          - 422
          message: Address must not be empty
          description: Одна из обязательных частей адреса пуста.
        INVALID_COORDINATES:
          http_statuses:
          - 422
          message: Coordinates must be provided together
          description: Нет полной пары координат; при ошибке диапазона сообщение Coordinates are out of range.
        INVALID_TITLE:
          http_statuses:
          - 422
          message: Title must contain between 1 and 250 characters
          description: Недопустимое название события.
        TIMEZONE_REQUIRED:
          http_statuses:
          - 422
          message: Datetime must include a timezone
          description: Отсутствует часовой пояс даты события.
        INVALID_INTERVAL:
          http_statuses:
          - 422
          message: End must be after start
          description: ends_at не строго позже starts_at.
        INVALID_PRICE:
          http_statuses:
          - 422
          message: Price must not be negative
          description: Отрицательная цена билета.
        INVALID_QUOTA:
          http_statuses:
          - 422
          message: Ticket quota must be positive
          description: Неположительная квота.
        INVALID_AGE_RATING:
          http_statuses:
          - 422
          message: Unknown age rating
          description: Возрастная категория не равна 0/6/12/16/18.
        INVALID_STATUS:
          http_statuses:
          - 422
          message: Unknown event status
          description: Неизвестный статус события.
        QUOTA_EXCEEDS_CAPACITY:
          http_statuses:
          - 422
          message: Ticket quota exceeds venue capacity
          description: Квота больше вместимости выбранной площадки.
        INVALID_QUANTITY:
          http_statuses:
          - 422
          message: Quantity must be positive
          description: Количество билетов должно быть положительным.
        BULK_VALIDATION_FAILED:
          http_statuses:
          - 422
          message: Bulk operation validation failed
          description: При dry_run=false хотя бы одна операция не прошла бизнес-валидацию; errors содержит индексы
            и причины, весь пакет откатывается.
        NOT_READY:
          http_statuses:
          - 503
          message: Database is not ready
          description: Инициализация не завершена или метаданные недоступны/несовместимы; сообщения также Database
            initialization is pending и Dataset metadata is not ready.
        SCHEMA_MISMATCH:
          http_statuses:
