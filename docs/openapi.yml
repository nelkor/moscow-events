      description: Строка агрегата. Только выбранные метрики и group_key/group_label включаются в ответ. ticket_quota
        означает сумму квот; occupancy_percent = SUM(sold_tickets)/SUM(ticket_quota)*100, а не среднее процентов.
        Для пустой общей выборки суммы/счётчики равны 0, средняя/медиана/минимум/максимум/заполняемость — null.
      additionalProperties: false
    ReservationAnalyticsOut:
