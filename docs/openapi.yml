      description: Группы по полному отфильтрованному набору, без пагинации. При group_by=none возвращается одна
        строка с group_key=all и group_label=Все, даже для пустого набора; при других группировках пустой набор
        даёт data=[]. Незаполненные группы и отсутствующие даты не дополняются нулями.
    ReservationCreate:
      properties:
        event_id:
