      description: Создание подтверждённой брони. Клиент передаёт только event_id и quantity; цены, статус и даты
        определяет сервер. Требуется Idempotency-Key.
    ReservationOut:
      properties:
        id:
          type: string
          format: uuid
          description: UUID сущности, созданный сервером.
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Дата создания записи с часовым поясом; задаёт сервер.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Дата последнего изменения записи с часовым поясом; задаёт сервер.
          readOnly: true
        event_id:
          type: string
          format: uuid
          description: UUID существующего мероприятия.
        quantity:
          type: integer
          description: Положительное целое количество билетов в бронировании.
          minimum: 1
        unit_price_rub:
          type: integer
          description: Снимок цены билета на момент создания бронирования. Серверное поле, не принимается от клиента.
          minimum: 0
          readOnly: true
        total_price_rub:
          type: integer
          description: quantity * unit_price_rub. Снимок итоговой стоимости, не пересчитывается при изменении события.
          minimum: 0
          readOnly: true
        status:
          $ref: '#/components/schemas/ReservationStatus'
          description: confirmed — подтверждено, cancelled — отменено. PATCH допускает только cancelled.
        booked_at:
          type: string
          format: date-time
          description: Дата и время создания бронирования с часовым поясом; задаёт сервер.
        cancelled_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Дата и время отмены бронирования; null для confirmed.
