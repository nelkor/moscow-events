# Расширенная спецификация фактически реализованного API.
# Описания — на русском; технические коды и сообщения сервера — на английском.
openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Moscow Events API
  version: 1.0.0
  description: |
    Учебный REST API «Московская афиша»: артисты и группы, площадки Москвы, серии, мероприятия, бронирования, геопоиск и аналитика.

    ## Общие правила
    - Основной префикс — `/api/v1`; служебные проверки находятся в `/health`, интерфейсы документации — в `/docs` и `/redoc`.
    - Авторизация отсутствует. Все описанные операции доступны без токенов и cookie.
    - Запросы с телом используют `application/json`, ответы API — `application/json` и UTF-8. GeoJSON также передаётся с `Content-Type: application/json`.
    - Имена полей, коды жанров, округов, статусов и ошибок — стабильные технические значения на английском. Названия сущностей и справочников SAMPLE — на русском. Клиентские названия и описания хранятся как Unicode; ограничение на русский язык для пользовательского ввода отсутствует.
    - UUID создаёт сервер. UUID в примерах иллюстративные: ссылки на реальные сущности необходимо получать через API.
    - Даты начала/окончания, границы временных фильтров и даты бронирований содержат часовой пояс: ISO 8601/RFC 3339 с `Z` или смещением. Знак `+` в query-параметре следует кодировать как `%2B`.
    - Даты хранятся как `timestamptz`. Временные группировки используют `Europe/Moscow`; локальное представление времени выбирает клиент.
    - Цены выражаются целыми рублями. Нулевая цена допустима. При передаче целых числовых полей тела запроса значения `true`, `false` и дробные JSON-числа не принимаются.

    ## Списки, поиск и частичные изменения
    - CRUD-списки имеют `page >= 1`, `page_size` от 1 до 100 (по умолчанию 25) и возвращают `data` и `meta: {page, page_size, total}`. Пустая выборка: `data: []`, `total: 0`; номер страницы за пределами результата тоже возвращает пустой массив.
    - Параметр `sort` содержит ровно одно поле; префикс `-` задаёт убывание. Вторичный порядок всегда по `id` по возрастанию.
    - `q` ищет подстроку названия и описания без учёта регистра. Символы `%` и `_` ищутся буквально.
    - Фильтры объединяются логическим И. Временные интервалы — полуоткрытые `[from, to)`, ценовые и пространственные границы включены. Нижняя граница не может превышать верхнюю; одинаковые временные границы дают пустой интервал.
    - В списке `/events` и аналитике без `status` учитываются все статусы. В `/events/nearby` и `/events/geojson` по умолчанию `published`. Неявного фильтра «только будущие события» нет.
    - Неизвестные query-параметры в списках, географических и аналитических запросах отклоняются. Справочники возвращаются целиком, без пагинации.
    - В PATCH пропущенные поля сохраняют старые значения; `null` разрешён только у nullable-полей. Пустой объект допустим. Используется обычный JSON-объект, а не JSON Patch.
    - Неизвестные поля тела запроса запрещены, в том числе в отдельных bulk-операциях. Пустые и состоящие только из пробелов названия запрещены. Возможные дубликаты имён и пересечения расписаний допускаются.

    ## География
    Координаты WGS84: `latitude` — широта, `longitude` — долгота. В GeoJSON и PostGIS порядок обратный: `[longitude, latitude]`. Площадки без полной пары координат не участвуют в GeoJSON и геопоиске. В БД одна авторитетная точка `geography(Point,4326)` с GiST-индексом. Радиус проверяется через `ST_DWithin`, расстояние — через `ST_Distance` в метрах по поверхности Земли, а не по дорогам.

    ## Бронирования и атомарность
    Бронирование разрешено только для `published`. Проверка остатка и сохранение брони выполняются в транзакции с блокировкой мероприятия. Цена брони фиксируется на момент её создания. Отмена брони освобождает места; отмена события отменяет все его подтверждённые брони в той же транзакции. Квота не может превышать вместимость или стать ниже уже подтверждённых продаж. Удаление события с любыми бронированиями запрещено.

    ## Идемпотентность
    `Idempotency-Key` обязателен для `POST /reservations` и для `POST /events/bulk` при `dry_run=false`. Длина — 1–200 символов; UUID рекомендуется как удобное значение. Ключ действует в пределах соответствующего метода; хранятся ключ, отпечаток разобранного запроса и исходный успешный ответ. Повтор с тем же ключом и тем же запросом возвращает этот ответ, с другим запросом — `409 IDEMPOTENCY_CONFLICT`. Записи переживают рестарт и перенос дампа; автоматического срока истечения нет. Повтор создания брони возвращает исходный снимок ответа даже после последующей отмены брони. Для остальных изменяющих методов механизм ключей не реализован.

    ## Ошибки
    Ошибки JSON API имеют вид `{error: {code, message, details}}`. Сообщения `message` — на английском, клиент использует стабильный `code` для своих текстов. `400` означает некорректный query/path/header, некорректный JSON или отсутствие обязательного ключа идемпотентности; `422` — ошибки тела или бизнес-валидации; `404` — отсутствие объекта, включая объект по внешней ссылке; `409` — конфликт состояния; `503` — отсутствие готовности или доступности БД; `500` — непредвиденная ошибка. SQL, параметры подключения и stack trace не возвращаются. Неизвестный маршрут и неподдерживаемый метод дают `HTTP_ERROR` с HTTP 404/405. Подробности кодов перечислены в `ErrorCode`.

    ## Инициализация и набор данных
    На пустой БД применяются миграция `2026_01` и режим `SEED_MODE=sample|empty` (по умолчанию `sample`). SAMPLE содержит 14 артистов, 10 площадок (одна без координат), 3 серии, 36 событий и 60 синтетических бронирований. Это демонстрационный набор, а не предел размера каталога. Рестарт не дополняет и не перезаписывает имеющиеся данные, `dataset_id` и `reference_time` сохраняются. После восстановления совместимого PostgreSQL-дампа используется импортированная метаинформация. HTTP-методов экспорта/восстановления дампа, импорта CSV, авторизации и генерации большого набора нет; CSV-клиент может использовать bulk. Расписание артиста/площадки читается через фильтры `/events`.

    ## Доступ через NGINX и служебные маршруты
    Браузер обращается к API относительными URL `/api/v1/...` через тот же NGINX, который раздаёт фронтенд. NGINX и backend находятся в общей Docker-сети; прокси сохраняет исходный путь и передаёт заголовки Content-Type и Idempotency-Key. Служебные маршруты `/health`, `/docs`, `/redoc` и `/openapi.json` также проксируются в backend. Неподдерживаемый метод, включая OPTIONS, возвращает HTTP 405 в общем JSON-конверте ошибок. Автоматический переход между формами URL с завершающим `/` и без него может возвращать 307 с `Location`.

    `/openapi.json` — автогенерируемая схема сервера. Этот YAML описывает те же API-операции с расширенными русскими пояснениями и примерами, а также перечисляет маршруты HTML-документации. Сам файл `/openapi.yml` сервером автоматически не публикуется.
servers:
- url: /
  description: Текущий сервер; пути ниже уже содержат /api/v1, где он требуется
security: []
tags:
- name: metadata
  description: Версии, происхождение и размеры набора, справочники жанров, округов и возрастных категорий.
- name: artists
  description: Артисты и группы. Несколько артистов могут иметь одинаковое или похожее имя.
- name: venues
  description: Площадки Москвы, адреса, вместимость и координаты для карты.
- name: series
  description: Именованные группы связанных событий. Расписание повторений вычисляет клиент.
- name: events
  description: 'Мероприятия: CRUD, фильтры, геопоиск, GeoJSON и атомарные массовые операции.'
- name: reservations
  description: Создание и отмена синтетических бронирований без персональных и платёжных данных.
- name: analytics
  description: Агрегаты по полному отфильтрованному набору, без ограничения первой страницей.
- name: health
  description: Проверки процесса и готовности PostgreSQL/PostGIS.
- name: documentation
  description: Машиночитаемая схема и HTML-интерфейсы документации.
paths:
  /api/v1/meta:
    get:
      tags:
      - metadata
      summary: Получить версии и сведения о текущем наборе
      operationId: metadata_api_v1_meta_get
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaOut'
              examples:
                success:
                  $ref: '#/components/examples/Metadata'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      description: Возвращает версию приложения/API/схемы, сохранённый reference_time, происхождение текущей БД,
        доступные функции, лимиты и контрольную точку SAMPLE. Для импортированной БД значения берутся из её метаданных.
        Требует готовности БД.
  /api/v1/dataset/summary:
    get:
      tags:
      - metadata
      summary: Получить размеры и происхождение текущего набора
      operationId: dataset_summary_api_v1_dataset_summary_get
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryOut'
              examples:
                success:
                  $ref: '#/components/examples/DatasetSummary'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      description: Возвращает /meta вместе с точными counts для artists, venues, series, events, reservations и
        фактическими версиями PostgreSQL/PostGIS. Счётчики включают все статусы. Метод нужен для проверки обмена
        PostgreSQL-дампами; сам дамп через HTTP не формируется.
  /api/v1/meta/genres:
    get:
      tags:
      - metadata
      summary: Получить справочник жанров
      operationId: genres_api_v1_meta_genres_get
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreCatalog'
              examples:
                success:
                  $ref: '#/components/examples/Genres'
        '500':
          $ref: '#/components/responses/InternalError'
      description: Полный закрытый справочник из 9 жанров с английскими кодами и русскими названиями. Не требует
        БД; не зависит от записей текущего каталога. Фильтры и пагинация отсутствуют.
  /api/v1/meta/districts:
    get:
      tags:
      - metadata
      summary: Получить справочник административных округов Москвы
      operationId: districts_api_v1_meta_districts_get
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistrictCatalog'
              examples:
                success:
                  $ref: '#/components/examples/Districts'
        '500':
          $ref: '#/components/responses/InternalError'
      description: Полный справочник из 12 округов с техническими кодами CAO, SAO и т. д. и русскими названиями.
        Уровень — административные округа, не муниципальные районы. Не требует БД; пагинации нет.
  /api/v1/meta/age-ratings:
    get:
      tags:
      - metadata
      summary: Получить справочник возрастных категорий
      operationId: age_ratings_api_v1_meta_age_ratings_get
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgeRatingCatalog'
              examples:
                success:
                  $ref: '#/components/examples/AgeRatings'
        '500':
          $ref: '#/components/responses/InternalError'
      description: Категории 0, 6, 12, 16, 18 с названиями 0+, 6+, 12+, 16+, 18+. Не требует БД; пагинации нет.
  /api/v1/events/nearby:
    get:
      tags:
      - events
      summary: Найти мероприятия в радиусе заданной точки
      operationId: nearby_api_v1_events_nearby_get
      parameters:
      - $ref: '#/components/parameters/EventIncludes'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/SearchQuery'
      - $ref: '#/components/parameters/ArtistId'
      - $ref: '#/components/parameters/VenueId'
      - $ref: '#/components/parameters/SeriesId'
      - $ref: '#/components/parameters/GenreCode'
      - $ref: '#/components/parameters/DistrictCode'
      - $ref: '#/components/parameters/PublishedEventStatusFilter'
      - $ref: '#/components/parameters/StartsFrom'
      - $ref: '#/components/parameters/StartsTo'
      - $ref: '#/components/parameters/PriceMin'
      - $ref: '#/components/parameters/PriceMax'
      - $ref: '#/components/parameters/AgeMax'
      - $ref: '#/components/parameters/TicketsMin'
      - $ref: '#/components/parameters/NearbySort'
      - $ref: '#/components/parameters/Latitude'
      - $ref: '#/components/parameters/Longitude'
      - $ref: '#/components/parameters/RadiusM'
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_EventOut_'
              examples:
                nearby:
                  $ref: '#/components/examples/NearbyPage'
                empty:
                  $ref: '#/components/examples/EmptyPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      description: Обязательны latitude, longitude, radius_m. Проверяется точка площадки через ST_DWithin по geography,
        включая границу радиуса. Без status выбираются только published; неявного ограничения будущими датами нет.
        Площадки без координат исключаются. Расстояние в метрах вычисляет ST_Distance. Порядок всегда distance_m,
        starts_at, id по возрастанию; параметр sort валидируется, но в этом методе не меняет этот порядок. Пагинация
        применяется после всех фильтров. Для каждого события всегда включаются venue и distance_m; include=artist
        дополнительно включает исполнителя.
      x-unknown-query-parameters: reject
  /api/v1/events/geojson:
    get:
      tags:
      - events
      summary: Получить точки мероприятий в GeoJSON
      operationId: events_geojson_api_v1_events_geojson_get
      parameters:
      - $ref: '#/components/parameters/BoundingBox'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/SearchQuery'
      - $ref: '#/components/parameters/ArtistId'
      - $ref: '#/components/parameters/VenueId'
      - $ref: '#/components/parameters/SeriesId'
      - $ref: '#/components/parameters/GenreCode'
      - $ref: '#/components/parameters/DistrictCode'
      - $ref: '#/components/parameters/PublishedEventStatusFilter'
      - $ref: '#/components/parameters/StartsFrom'
      - $ref: '#/components/parameters/StartsTo'
      - $ref: '#/components/parameters/PriceMin'
      - $ref: '#/components/parameters/PriceMax'
      - $ref: '#/components/parameters/AgeMax'
      - $ref: '#/components/parameters/TicketsMin'
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventFeatureCollection'
              examples:
                events:
                  $ref: '#/components/examples/EventGeoJSON'
                empty:
                  $ref: '#/components/examples/EmptyGeoJSON'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      description: FeatureCollection мероприятий с координатами их площадок. По умолчанию только published, без
        неявного фильтра будущих дат. Поддерживаются все предметные фильтры EventFilters, bbox и limit; page, page_size,
        sort и include не принимаются. properties содержит EventOut и обязательную venue. Каждый объект соответствует
        событию, поэтому события одной площадки могут иметь одинаковую точку. artist и distance_m не добавляются.
        Порядок по UUID события; Content-Type — application/json.
      x-unknown-query-parameters: reject
  /api/v1/venues/geojson:
    get:
      tags:
      - venues
      summary: Получить точки площадок в GeoJSON
      operationId: venues_geojson_api_v1_venues_geojson_get
      parameters:
      - $ref: '#/components/parameters/BoundingBox'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/SearchQuery'
      - $ref: '#/components/parameters/DistrictCode'
      - $ref: '#/components/parameters/CapacityMin'
      - $ref: '#/components/parameters/HasCoordinates'
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueFeatureCollection'
              examples:
                venues:
                  $ref: '#/components/examples/VenueGeoJSON'
                empty:
                  $ref: '#/components/examples/EmptyGeoJSON'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      description: FeatureCollection только для площадок с координатами. Поддерживаются фильтры каталога площадок,
        bbox и limit. properties содержит полную VenueOut. Геометрия Point имеет [longitude,latitude]; порядок объектов
        по UUID. При отсутствии точек features=[]. has_coordinates=false вместе с этим методом даёт пустую коллекцию.
        Content-Type — application/json.
      x-unknown-query-parameters: reject
  /api/v1/events/bulk:
    post:
      tags:
      - events
      summary: Проверить или атомарно применить пакет изменений мероприятий
      operationId: bulk_api_v1_events_bulk_post
      parameters:
      - $ref: '#/components/parameters/BulkIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkRequest'
            examples:
              preview:
                $ref: '#/components/examples/BulkPreviewRequest'
              commit:
                $ref: '#/components/examples/BulkCommitRequest'
              preview_with_error:
                $ref: '#/components/examples/BulkInvalidPreviewRequest'
        description: Обязательный JSON-объект; неизвестные поля запрещены. Для PATCH пропущенные поля сохраняются.
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOut'
              examples:
                preview:
                  $ref: '#/components/examples/BulkPreview'
                commit:
                  $ref: '#/components/examples/BulkCommitted'
                preview_with_error:
                  $ref: '#/components/examples/BulkPreviewWithError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      description: |-
        Пакет содержит от 1 до 200 операций create, update, archive и исполняется в указанном порядке. Успешное изменение видно следующим операциям.

        - `dry_run=true` (по умолчанию): валидация и прогноз без сохранения в БД, включая откат пробных отмен бронирований. Ответ 200 может содержать errors. Счётчики и changes описывают успешные операции предпросмотра. Созданные UUID не зарезервированы для последующего применения.
        - `dry_run=false`: обязателен Idempotency-Key. Все корректные операции применяются одной транзакцией; хотя бы одна бизнес-ошибка даёт 422 BULK_VALIDATION_FAILED с details.errors и полным откатом, включая бронирования. Успех — 200 с errors=[]. Повтор с тем же ключом возвращает сохранённый результат.
        - `create.fields` соответствует EventCreate; `update.fields` — EventPatch; `archive` принимает только op и id и устанавливает archived без отмены броней.
        - Индекс операции начинается с 0. Синтаксические/структурные ошибки тела дают обычный VALIDATION_ERROR до выполнения пакета; details.errors содержит location и operation_index, когда его можно определить.
        - Успешные операции до и после бизнес-ошибки могут присутствовать в предпросмотре; они не сохраняются. Количество операций, а не уникальных UUID, формирует счётчики.

        CSV импортирует клиент: преобразует строки в эти операции и отправляет последовательные пакеты. Транзакционность гарантирована внутри одного запроса, не между несколькими пакетами.
