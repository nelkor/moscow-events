          message: Resource is referenced by other records
          details: {}
    InvalidInterval:
      summary: Окончание не позже начала (422)
      value:
        error:
          code: INVALID_INTERVAL
          message: End must be after start
          details: {}
    BulkValidationError:
      summary: Ошибка пакета с полным откатом (422)
      value:
        error:
          code: BULK_VALIDATION_FAILED
          message: Bulk operation validation failed
          details:
            errors:
            - operation_index: 1
              code: QUOTA_BELOW_SALES
              message: Ticket quota is below confirmed sales
              details:
                sold_tickets: 3
    DatabaseUnavailable:
      summary: БД временно недоступна (503)
      value:
        error:
          code: DATABASE_UNAVAILABLE
          message: Database is temporarily unavailable
          details: {}
    NotReady:
      summary: Инициализация БД ещё не завершена (503)
      value:
        error:
          code: NOT_READY
          message: Database initialization is pending
          details: {}
    InternalError:
      summary: Непредвиденная ошибка (500)
      value:
        error:
          code: INTERNAL_ERROR
          message: An internal error occurred
          details: {}
    MethodNotAllowed:
      summary: Метод для существующего маршрута не поддерживается (405)
      value:
        error:
          code: HTTP_ERROR
          message: Method Not Allowed
          details: {}
  parameters:
    EventIncludes:
      name: include
      in: query
      required: false
      schema:
        type: string
        default: ''
      description: Строка из venue,artist,availability через запятую без пробелов (например venue,artist). Пустая
        строка — без вложений. availability разрешено, но три поля доступности возвращаются всегда.
      style: form
      explode: true
      example: venue,artist
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Номер страницы от 1. За последней страницей возвращаются data=[] и прежнее total.
      style: form
      explode: true
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        maximum: 100
        minimum: 1
        default: 25
      description: Размер страницы от 1 до 100; по умолчанию 25.
      style: form
      explode: true
    SearchQuery:
      name: q
      in: query
      required: false
      schema:
        anyOf:
        - type: string
          maxLength: 250
        - type: 'null'
      description: Подстрока названия или описания без учёта регистра, максимум 250 символов. % и _ не являются
        шаблонными символами.
      style: form
      explode: true
    ArtistId:
      name: artist_id
      in: query
      required: false
      schema:
        anyOf:
        - type: string
          format: uuid
        - type: 'null'
      description: Отбор по UUID основного артиста/группы.
      style: form
      explode: true
    VenueId:
      name: venue_id
      in: query
      required: false
      schema:
        anyOf:
        - type: string
          format: uuid
        - type: 'null'
      description: Отбор по UUID площадки; позволяет читать её расписание вместе с starts_from/starts_to.
      style: form
      explode: true
    SeriesId:
      name: series_id
      in: query
      required: false
      schema:
        anyOf:
        - type: string
          format: uuid
        - type: 'null'
      description: Отбор по UUID серии. HTTP query-фильтра «series_id is null» нет.
      style: form
      explode: true
    GenreCode:
      name: genre_code
      in: query
      required: false
      schema:
        anyOf:
        - enum:
          - concert
          - theatre
          - standup
          - lecture
          - exhibition
          - festival
          - cinema
          - workshop
          - excursion
          type: string
        - type: 'null'
      description: Отбор по жанру мероприятия, точное совпадение машинного кода.
      style: form
      explode: true
    DistrictCode:
      name: district_code
      in: query
      required: false
      schema:
        anyOf:
        - enum:
          - CAO
          - SAO
          - SVAO
          - VAO
          - UVAO
          - UAO
          - UZAO
          - ZAO
          - SZAO
          - ZELAO
          - TAO
          - NAO
          type: string
        - type: 'null'
      description: Код административного округа площадки; справочник /api/v1/meta/districts.
      style: form
      explode: true
    PublishedEventStatusFilter:
      name: status
      in: query
      required: false
      schema:
        anyOf:
        - enum:
          - draft
          - published
          - cancelled
          - archived
          type: string
        - type: 'null'
        default: published
      description: Точный статус события. При отсутствии — published; чтобы читать другой статус, задайте его явно.
      style: form
      explode: true
    StartsFrom:
      name: starts_from
      in: query
      required: false
      schema:
        anyOf:
        - type: string
          format: date-time
        - type: 'null'
      description: Включительная нижняя граница начала события, с часовым поясом. Проверяется starts_at >= starts_from.
      style: form
      explode: true
    StartsTo:
      name: starts_to
      in: query
      required: false
      schema:
        anyOf:
        - type: string
          format: date-time
        - type: 'null'
      description: Исключительная верхняя граница начала события, с часовым поясом. Проверяется starts_at < starts_to;
        это не фильтр ends_at.
      style: form
      explode: true
    PriceMin:
      name: price_min
      in: query
      required: false
      schema:
        anyOf:
        - type: integer
          minimum: 0
        - type: 'null'
      description: Минимальная текущая цена билета в рублях, включительно; не цена-снимок бронирования.
      style: form
      explode: true
    PriceMax:
      name: price_max
      in: query
      required: false
      schema:
        anyOf:
        - type: integer
          minimum: 0
        - type: 'null'
      description: Максимальная текущая цена билета в рублях, включительно; price_min не может быть больше price_max.
      style: form
      explode: true
    AgeMax:
      name: age_max
      in: query
      required: false
      schema:
        anyOf:
        - type: integer
          maximum: 150
          minimum: 0
        - type: 'null'
      description: Возраст посетителя от 0 до 150. Включаются события с age_rating <= age_max; возраст не обязан
        совпадать с категорией 0/6/12/16/18.
      style: form
      explode: true
    TicketsMin:
      name: tickets_min
      in: query
      required: false
      schema:
        anyOf:
        - type: integer
          minimum: 0
        - type: 'null'
      description: Минимальный доступный остаток ticket_quota - sold_tickets, включительно; sold_tickets считает
        только confirmed.
      style: form
      explode: true
    NearbySort:
      name: sort
      in: query
      required: false
      schema:
        enum:
