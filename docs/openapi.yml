              examples:
                success:
                  $ref: '#/components/examples/Liveness'
        '500':
          $ref: '#/components/responses/InternalError'
      description: 'Всегда отвечает {status: alive} при работающем HTTP-процессе; не обращается к БД и не гарантирует
        её готовность. Доступен при ожидающей инициализации.'
  /health/ready:
    get:
      tags:
      - health
      summary: Проверить готовность PostgreSQL, схемы, PostGIS и метаданных
      operationId: ready_health_ready_get
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
              examples:
                success:
                  $ref: '#/components/examples/Readiness'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      description: 'Проверяет завершение начальной миграции/инициализации, доступность БД, версию schema_migrations,
        функцию PostGIS и совместимые метаданные. Успех — {status: ready}. Пока инициализация ожидает БД, ответ
        503 NOT_READY; при ошибках доступа — 503 DATABASE_UNAVAILABLE; при несовместимой версии — 503 SCHEMA_MISMATCH
        либо NOT_READY для метаданных. Приложение повторяет начальную инициализацию с паузой, сохраняя доступность
