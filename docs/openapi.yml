      description: |-
        Применяет предметные фильтры события (включая status, который здесь означает статус события) и дополнительно booked_from/booked_to к booked_at. Фильтры starts_from/starts_to относятся к starts_at события. Это разные временные оси.

        Метрики: reservation_count — количество confirmed; sold_tickets — сумма их quantity; revenue_rub — сумма их зафиксированных total_price_rub; cancelled_count — количество cancelled. Текущая цена события не подменяет цену брони, однако price_min/price_max фильтруют именно текущую цену события. Отменённые брони учитываются только в cancelled_count.

        group_by=none => одна общая строка all/«Все»; genre/district => код и русское название; venue/artist => UUID и имя; day/week/month => начало соответствующего периода booked_at в Europe/Moscow, YYYY-MM-DD. Неделя начинается в понедельник. interval задаёт временную группировку при group_by=none; с явно выбранным group_by он обязан совпадать, иначе 400 INVALID_GROUPING. Второй параллельной группировки по предметному признаку при interval нет.

