      description: |-
        Применяет все фильтры EventFilters к полному набору, без пагинации. Без status учитываются все статусы и все даты.

        Метрики: event_count — количество событий; avg_price_rub — невзвешенное среднее текущих цен; median_price_rub — percentile_cont(0.5); min/max_price_rub — текущий минимум/максимум; ticket_quota — сумма квот; sold_tickets — сумма quantity подтверждённых броней; occupancy_percent — SUM(sold_tickets)/SUM(ticket_quota)*100, а не среднее процентов.

        Группы: none => ключ all и подпись «Все»; genre/district => машинный код и русское название; venue/artist => строковый UUID и имя; age_rating => строка числа; month => первый день месяца YYYY-MM-01; weekday => ISO-номер дня 1=понедельник…7=воскресенье; hour => строка часа 0…23. Временные группы вычисляются по starts_at в Europe/Moscow. Порядок групп — по исходному ключу по возрастанию (для числовых групп — численно).

        Без metrics возвращаются все восемь метрик; с metrics — только выбранные поля и group_key/group_label. При пустой общей выборке возвращается одна строка: счётчики/суммы 0, среднее/медиана/минимум/максимум/процент null. При других группировках пустой набор даёт data=[]. Отсутствующие категории не добавляются искусственно.
