      - created_at
      - updated_at
      - event_id
      - quantity
      - unit_price_rub
      - total_price_rub
      - status
      - booked_at
      - cancelled_at
      title: ReservationOut
      description: Бронирование без персональных данных. Цены — неизменяемый снимок. cancelled_at заполнен только
        при cancelled.
    ReservationPatch:
      properties:
