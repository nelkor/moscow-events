        - price_rub
        - -price_rub
        - title
        - -title
        - created_at
        - -created_at
        type: string
        default: starts_at
      description: 'Принимает и валидирует тот же набор значений, что /events, но не меняет обязательную сортировку
        nearby: distance_m, starts_at, id.'
      style: form
      explode: true
    Latitude:
      name: latitude
      in: query
      required: true
      schema:
        type: number
        maximum: 90
        minimum: -90
      description: Широта центра WGS84 в градусах от -90 до 90; конечное число.
      style: form
      explode: true
    Longitude:
      name: longitude
      in: query
      required: true
      schema:
        type: number
        maximum: 180
        minimum: -180
      description: Долгота центра WGS84 в градусах от -180 до 180; конечное число.
      style: form
      explode: true
    RadiusM:
      name: radius_m
      in: query
      required: true
      schema:
        type: integer
        maximum: 100000
        minimum: 1
      description: Целый радиус в метрах от 1 до 100000; граница включена. Проверяется координата площадки.
      style: form
      explode: true
    BoundingBox:
      name: bbox
      in: query
      required: false
      schema:
        anyOf:
        - type: string
        - type: 'null'
      description: 'Строка west,south,east,north из четырёх конечных чисел: -180 <= west <= east <= 180, -90 <=
        south <= north <= 90. Границы включены; пересечение антимеридиана не поддерживается.'
      style: form
      explode: true
      example: 37.60,55.73,37.64,55.78
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        maximum: 1000
        minimum: 1
        default: 1000
      description: 'Максимум GeoJSON-объектов после фильтров: от 1 до 1000, по умолчанию 1000. Порядок по UUID,
        постраничного meta нет.'
      style: form
      explode: true
    CapacityMin:
      name: capacity_min
      in: query
      required: false
      schema:
        anyOf:
        - type: integer
          minimum: 1
        - type: 'null'
      description: Минимальная вместимость площадки, включительно, не менее 1.
      style: form
      explode: true
    HasCoordinates:
      name: has_coordinates
      in: query
      required: false
      schema:
        anyOf:
        - type: boolean
        - type: 'null'
      description: true — только площадки с координатами, false — без координат, отсутствие — все площадки. Для
        GeoJSON точки без координат всё равно исключаются.
      style: form
      explode: true
    BulkIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: Ключ идемпотентности длиной 1–200 символов. Повтор того же запроса возвращает исходный ответ;
        другой запрос с тем же ключом — 409 IDEMPOTENCY_CONFLICT. Заголовок не зависит от регистра имени. Обязателен
        при dry_run=false; для dry_run=true не требуется и не сохраняется.
      example: 7b0198e6-7cee-4303-9a93-cc7508b4bb61
      x-required-when: dry_run=false
    EventMetrics:
      name: metrics
