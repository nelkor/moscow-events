      description: Обязателен Idempotency-Key. Клиент передаёт только event_id и quantity. В транзакции блокируется
        событие, проверяются published и доступный остаток, затем создаётся confirmed-бронь. unit_price_rub равен
        текущей цене события, total_price_rub=quantity*unit_price_rub; даты назначает сервер. При нехватке 409 INSUFFICIENT_TICKETS,
        при другом статусе события 409 EVENT_NOT_BOOKABLE. Неявного запрета бронировать прошедшее published-событие
