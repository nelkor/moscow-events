          description: 'Число проданных билетов: сумма quantity только подтверждённых бронирований.'
          type: integer
          minimum: 0
        reservation_count:
          description: Число подтверждённых бронирований, без cancelled.
          type: integer
          minimum: 0
        revenue_rub:
          description: Сумма сохранённых total_price_rub только подтверждённых бронирований.
          type: integer
          minimum: 0
        cancelled_count:
          description: Число отменённых бронирований, независимо от количества подтверждённых продаж.
          type: integer
          minimum: 0
      type: object
      required:
      - group_key
      - group_label
