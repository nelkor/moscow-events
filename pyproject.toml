[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "moscow-events-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "tzdata>=2025.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "httpx2>=2.16,<3", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["app.tests*"]

[tool.setuptools.package-data]
"app.infrastructure" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
markers = ["integration: проверки с настоящей PostgreSQL/PostGIS"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
